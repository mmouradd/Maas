spring.application.name=maas-backend
server.port=8080

# ---------- Base de donnees MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/maas_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# IMPORTANT : au moins 32 caracteres. A remplacer par une valeur secrete en production
# (variable d'environnement APP_JWT_SECRET).
app.jwt.secret=change-this-secret-key-min-32-characters-long-for-hs256
# Duree de validite du token : 24h
app.jwt.expiration-ms=86400000

# ---------- Compte admin initial ----------
app.admin.email=admin@gsrm.local
app.admin.password=ChangeMe123!

# ---------- CORS (frontend) ----------
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173

# ---------- Email (SMTP) ----------
# Mettre app.mail.enabled=true et renseigner le SMTP pour activer les emails.
app.mail.enabled=false
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=noreply@gsrm.local
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
